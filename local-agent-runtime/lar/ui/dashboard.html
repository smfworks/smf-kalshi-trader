<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LAR Observatory</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #0b0d12;
    --panel: #14181f;
    --panel-2: #1a1f29;
    --line: #232a36;
    --text: #d8dde6;
    --muted: #7a8597;
    --accent: #4f46e5;
    --ok: #10b981;
    --warn: #f59e0b;
    --err: #ef4444;
    --closed: #10b981;
    --half: #f59e0b;
    --open: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif; }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600;
    letter-spacing: 0.4px; }
  header .dot { width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  header .dot.off { background: var(--err); box-shadow: 0 0 8px var(--err); }
  header .meta { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;
    padding: 12px; height: calc(100vh - 50px); }
  .card { background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 14px; overflow: hidden;
    display: flex; flex-direction: column; }
  .card h2 { font-size: 11px; font-weight: 600; margin: 0 0 10px 0;
    color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { display: flex; flex-direction: column; }
  .stat .num { font-size: 28px; font-weight: 600;
    font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat .lbl { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600; }
  .pill.closed { background: rgba(16,185,129,0.15); color: var(--closed); }
  .pill.half   { background: rgba(245,158,11,0.15); color: var(--half); }
  .pill.open   { background: rgba(239,68,68,0.15);  color: var(--open); }
  .pill.ok     { background: rgba(16,185,129,0.15); color: var(--ok); }
  .pill.warn   { background: rgba(245,158,11,0.15); color: var(--warn); }
  .pill.err    { background: rgba(239,68,68,0.15);  color: var(--err); }
  .bars { display: flex; gap: 4px; align-items: flex-end;
    height: 80px; padding-top: 8px; }
  .bars .bar { flex: 1; background: var(--accent);
    min-height: 2px; border-radius: 2px 2px 0 0;
    transition: height 0.2s; position: relative; }
  .bars .bar.err { background: var(--err); }
  .steps { flex: 1; overflow-y: auto; font-family: "SF Mono",
    "JetBrains Mono", "Consolas", monospace; font-size: 11px; }
  .step { padding: 6px 8px; border-bottom: 1px solid var(--line);
    display: grid; grid-template-columns: 70px 50px 1fr 60px; gap: 8px; }
  .step .t { color: var(--muted); }
  .step .p { font-weight: 600; }
  .step .p.observe { color: #60a5fa; }
  .step .p.think   { color: #a78bfa; }
  .step .p.act     { color: #fbbf24; }
  .step .p.respond { color: var(--ok); }
  .step .p.error   { color: var(--err); }
  .step .d { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .ms { text-align: right; color: var(--muted); }
  .step.err { background: rgba(239,68,68,0.05); }
  .tools { display: flex; flex-direction: column; gap: 6px; }
  .tool { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .tool .name { width: 80px; color: var(--muted); }
  .tool .bar-bg { flex: 1; background: var(--panel-2); height: 8px;
    border-radius: 4px; overflow: hidden; }
  .tool .bar-fg { background: var(--accent); height: 100%;
    border-radius: 4px; transition: width 0.2s; }
  .tool .ct { width: 30px; text-align: right;
    font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-style: italic; padding: 20px;
    text-align: center; }
  .health-list { display: flex; flex-direction: column; gap: 6px; }
  .health-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .health-row .name { flex: 1; }
  .health-row .lat { color: var(--muted);
    font-variant-numeric: tabular-nums; font-size: 11px; }
  #sparkline { width: 100%; height: 50px; }
  .row { display: flex; gap: 12px; }
  .col { flex: 1; }
</style>
</head>
<body>
<header>
  <div class="dot" id="connDot"></div>
  <h1>LAR Observatory</h1>
  <span class="meta" id="agentMeta">agent: lar</span>
  <span class="meta" id="uptime">uptime: 0s</span>
</header>

<main>
  <section class="card">
    <h2>Agent State</h2>
    <div class="grid-2">
      <div class="stat">
        <span class="num" id="totalSteps">0</span>
        <span class="lbl">Total Steps</span>
      </div>
      <div class="stat">
        <span class="num" id="errorCount">0</span>
        <span class="lbl">Errors</span>
      </div>
      <div class="stat">
        <span class="num" id="memWrites">0</span>
        <span class="lbl">Memory Writes</span>
      </div>
      <div class="stat">
        <span class="num" id="ckptCount">0</span>
        <span class="lbl">Checkpoints</span>
      </div>
    </div>
    <div style="margin-top: 14px;">
      <span style="color: var(--muted); font-size: 11px;">Phase:</span>
      <span class="pill" id="phasePill">idle</span>
      <span style="margin-left: 8px; color: var(--muted); font-size: 11px;">Circuit:</span>
      <span class="pill" id="circuitPill">CLOSED</span>
    </div>
    <h2 style="margin-top: 18px;">Step Latency (last 60)</h2>
    <div class="bars" id="latencyBars"></div>
  </section>

  <section class="card">
    <h2>Tool Usage</h2>
    <div class="tools" id="toolList">
      <div class="empty">No tool calls yet</div>
    </div>
    <h2 style="margin-top: 18px;">Health</h2>
    <div class="health-list" id="healthList">
      <div class="empty">Health monitor not attached</div>
    </div>
  </section>

  <section class="card" style="grid-row: span 2;">
    <h2>Step Stream</h2>
    <div class="steps" id="stepStream">
      <div class="empty">Waiting for events…</div>
    </div>
  </section>

  <section class="card" style="grid-column: span 2;">
    <h2>Recent Activity</h2>
    <div class="steps" id="recentSteps" style="max-height: 200px;">
      <div class="empty">No activity yet</div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const wsScheme = location.protocol === "https:" ? "wss" : "ws";
const wsUrl = `${wsScheme}://${location.host}/ws`;
let ws, lastSnapshot = null, latencyHist = [];

function setConn(on) {
  const d = $("connDot");
  d.classList.toggle("off", !on);
}

function connect() {
  ws = new WebSocket(wsUrl);
  ws.onopen = () => setConn(true);
  ws.onclose = () => { setConn(false); setTimeout(connect, 1500); };
  ws.onerror = () => setConn(false);
  ws.onmessage = (ev) => {
    try { render(JSON.parse(ev.data)); } catch (e) { console.error(e); }
  };
}

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toTimeString().slice(0,8);
}
function fmtUptime(s) {
  if (s < 60) return `${Math.floor(s)}s`;
  if (s < 3600) return `${Math.floor(s/60)}m ${Math.floor(s%60)}s`;
  return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;
}

function render(s) {
  lastSnapshot = s;
  $("agentMeta").textContent = `agent: ${s.agent_id}`;
  $("uptime").textContent = `uptime: ${fmtUptime(s.uptime_s)}`;
  $("totalSteps").textContent = s.total_steps;
  $("errorCount").textContent = s.error_count;
  $("memWrites").textContent = s.memory_writes;
  $("ckptCount").textContent = s.checkpoint_count;

  const phasePill = $("phasePill");
  phasePill.textContent = s.current_phase;
  phasePill.className = "pill " + (
    s.current_phase === "idle" ? "ok" :
    s.current_phase === "error" ? "err" : "warn"
  );

  const cp = $("circuitPill");
  cp.textContent = s.circuit_state;
  cp.className = "pill " + s.circuit_state.toLowerCase();

  // Latency bars
  latencyHist = s.recent_steps.slice(-60).map(x => x.duration_ms);
  const max = Math.max(100, ...latencyHist);
  $("latencyBars").innerHTML = latencyHist.map(ms => {
    const h = Math.max(2, (ms / max) * 80);
    return `<div class="bar" style="height:${h}px"></div>`;
  }).join("") || `<div class="empty">no data</div>`;

  // Tool usage
  const tools = Object.entries(s.tool_counts).filter(([_,v]) => v > 0);
  if (tools.length) {
    const maxT = Math.max(...tools.map(([_,v]) => v));
    $("toolList").innerHTML = tools.map(([n,v]) => {
      const w = (v/maxT)*100;
      return `<div class="tool">
        <span class="name">${n}</span>
        <div class="bar-bg"><div class="bar-fg" style="width:${w}%"></div></div>
        <span class="ct">${v}</span>
      </div>`;
    }).join("");
  } else {
    $("toolList").innerHTML = `<div class="empty">No tool calls yet</div>`;
  }

  // Health
  if (s.health && s.health.checks) {
    $("healthList").innerHTML = s.health.checks.map(c => {
      const cls = c.status === "OK" ? "ok" : c.status === "WARN" ? "warn" : "err";
      return `<div class="health-row">
        <span class="pill ${cls}">${c.status}</span>
        <span class="name">${c.name}</span>
        <span class="lat">${c.latency_ms || 0}ms</span>
      </div>`;
    }).join("");
  }

  // Step stream (newest first)
  const recent = s.recent_steps.slice(-30).reverse();
  if (recent.length) {
    $("stepStream").innerHTML = recent.map(st => {
      const cls = st.success ? "" : "err";
      return `<div class="step ${cls}">
        <span class="t">${fmtTime(st.timestamp)}</span>
        <span class="p ${st.phase}">${st.phase}</span>
        <span class="d" title="${(st.detail||'').replace(/"/g,'&quot;')}">${st.tool ? '['+st.tool+'] ' : ''}${st.detail||''}</span>
        <span class="ms">${st.duration_ms.toFixed(0)}ms</span>
      </div>`;
    }).join("");
  }

  // Recent activity (last 15)
  const last15 = s.recent_steps.slice(-15).reverse();
  if (last15.length) {
    $("recentSteps").innerHTML = last15.map(st => {
      const cls = st.success ? "" : "err";
      return `<div class="step ${cls}">
        <span class="t">${fmtTime(st.timestamp)}</span>
        <span class="p ${st.phase}">${st.phase}</span>
        <span class="d">${st.tool ? '['+st.tool+'] ' : ''}${st.detail||''}</span>
        <span class="ms">#${st.step_number}</span>
      </div>`;
    }).join("");
  }
}

connect();
</script>
</body>
</html>
